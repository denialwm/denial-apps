[package]
name = "polkit"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
# Built in Settings' workspace, with its lock and profile: Denial builds both
# programs from this repository and gpui-touch, in one Cargo run.
workspace = "../settings"

[dependencies]
async-channel = "2.5"
denial-look = { path = "../../libraries/denial-look" }
denial-look-gpui = { path = "../../libraries/denial-look-gpui" }
libc = "0.2"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zbus = "5.19"
zeroize = "1"
# The local gpui-touch checkout, as Settings builds against.
gpui = { path = "../../../gpui-touch/crates/gpui" }
gpui_platform = { path = "../../../gpui-touch/crates/gpui_platform", features = ["wayland"] }
