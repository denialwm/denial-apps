[package]
name = "settings"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
async-channel = "2.5"
async-io = "2.6"
denial-look = { path = "../../libraries/denial-look" }
denial-look-gpui = { path = "../../libraries/denial-look-gpui" }
futures-lite = "2.6"
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
libc = "0.2"
libm = "0.2"
log = "0.4"
serde = "1"
serde_json = "1"
zbus = "5.19"
# The local gpui-touch checkout, as Messages builds against; see
# apps/messages/Cargo.toml for what it carries beyond the pinned branch.
gpui = { path = "../../../gpui-touch/crates/gpui" }
gpui_platform = { path = "../../../gpui-touch/crates/gpui_platform", features = ["wayland"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

# A workspace of its own: Denial builds Settings and the Polkit agent from
# this repository and gpui-touch alone, where the other apps' workspace also
# needs Phonewave. What follows is that workspace's, kept the same as the
# repository root's.
[workspace]
members = [".", "../polkit"]

# zed's workspace patches; GPUI needs them in every dependent workspace.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
