[package]
name = "denial-plugins"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
# Built in Settings' workspace, with its lock and profile: Settings links the
# library, and Denial builds the `denial-plugins` command beside it.
workspace = "../../apps/settings"

[dependencies]
libc = "0.2"
semver = "1"
# Records keep the order they were written in, as the Dart manager wrote them.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
zbus = "5.19"

[dev-dependencies]
tempfile = "3"
