[workspace]
resolver = "3"
members = ["apps/*", "libraries/*"]
# Settings, the Polkit agent and the plugin manager are a workspace of their
# own, with its own lock: Denial builds them for every distribution from this
# repository and gpui-touch alone, and Camera needs Phonewave beside them.
exclude = ["apps/settings", "apps/polkit", "libraries/denial-plugins"]

[workspace.package]
license = "GPL-3.0-or-later"
publish = false

# zed's workspace patches; GPUI needs them in every dependent workspace.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
